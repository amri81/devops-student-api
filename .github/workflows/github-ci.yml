name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Wrapper ausführbar machen
        run: chmod +x mvnw

      - name: Maven Build und Tests
        run: ./mvnw clean package

      - name: Docker Compose prüfen
        run: docker compose config

      - name: Docker Image bauen und Container starten
        run: docker compose up --build -d

      - name: Warten bis Anwendung gestartet ist
        run: sleep 20

      - name: Laufende Container anzeigen
        run: docker compose ps

      - name: REST API testen
        run: curl --fail http://localhost:8080/api/tasks

      - name: Logs bei Fehler anzeigen
        if: failure()
        run: docker compose logs

      - name: Docker Umgebung stoppen
        if: always()
        run: docker compose down