name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-docker:
    name: Build, Test & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven Wrapper ausführbar machen
        run: chmod +x mvnw

      - name: Maven Build und Tests
        run: ./mvnw clean package

      - name: Docker Compose prüfen
        run: docker compose config

      - name: Docker Image bauen und Container starten
        run: docker compose up --build -d

      - name: Warten bis Anwendung gestartet ist
        run: sleep 20

      - name: Laufende Container anzeigen
        run: docker compose ps

      - name: REST API testen
        run: curl --fail http://localhost:8080/api/tasks

      - name: Docker Image speichern
        run: docker save devops-student-api:latest -o devops-student-api.tar

      - name: Docker Image als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: devops-student-api-image
          path: devops-student-api.tar
          retention-days: 1

      - name: Logs bei Fehler anzeigen
        if: failure()
        run: docker compose logs

      - name: CI Docker Umgebung stoppen
        if: always()
        run: docker compose down

  deploy:
    name: Deployment mit Docker Compose
    needs: build-test-docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Docker Image herunterladen
        uses: actions/download-artifact@v4
        with:
          name: devops-student-api-image
          path: .

      - name: Docker Image laden
        run: docker load -i devops-student-api.tar

      - name: Anwendung automatisch deployen
        run: docker compose up -d --no-build

      - name: Deployment prüfen
        run: docker compose ps